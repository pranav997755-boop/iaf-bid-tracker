name: Daily IAF bid refresh
on:
  schedule:
    - cron: "30 2 * * *"     # 08:00 IST every day
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: daily-refresh
jobs:
  refresh:
    # Use "self-hosted" here if GeM blocks GitHub's servers (see README, "If GeM blocks the cloud run").
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Collect bids from GeM
        run: python collector/scrape.py
      - name: Work out what changed and rebuild the app data
        run: python collector/build.py
      - name: Save state and publish
        run: |
          git config user.name "iaf-tracker-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/state.json docs/data.json
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
      - name: Phone notification (optional)
        if: success()
        env: { NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}", APP_URL: "${{ vars.APP_URL }}" }
        run: python collector/notify.py || true
      - name: Tell me if the run failed
        if: failure()
        env: { NTFY_TOPIC: "${{ secrets.NTFY_TOPIC }}" }
        run: |
          [ -n "$NTFY_TOPIC" ] && curl -s -H "Title: IAF tracker run FAILED" -d "Open the Actions tab on GitHub for details." "https://ntfy.sh/$NTFY_TOPIC" || true
