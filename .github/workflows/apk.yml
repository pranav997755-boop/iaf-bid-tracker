name: Build Android APK
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Create the Android wrapper around the app
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish IAF-Bids.apk as a release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk IAF-Bids.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest IAF-Bids.apk --title "IAF Bids app" --notes "Download IAF-Bids.apk on your Android phone and install it."
